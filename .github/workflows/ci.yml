name: SDK checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Create release candidate archive
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: miniapp-sdk-node-${{ matrix.node }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
